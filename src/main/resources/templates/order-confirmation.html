<!DOCTYPE html>
<!--
  Order confirmation. Shown after an order is placed (Phase 5.3).
-->
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::main})}">
<head>
    <title>FashionPlace - Order placed</title>
</head>
<body>
    <main>
        <div class="alert alert-success">
            <h1 class="h4 mb-1">Thank you! Your order has been placed.</h1>
            <span>Order #<span th:text="${order.id}">0</span></span>
        </div>

        <dl class="row">
            <dt class="col-sm-3">Status</dt>
            <dd class="col-sm-9" th:text="${order.status}">PLACED</dd>

            <dt class="col-sm-3">Shipping to</dt>
            <dd class="col-sm-9" th:text="${order.shippingAddress}">Address</dd>

            <dt class="col-sm-3">Total</dt>
            <dd class="col-sm-9 fw-bold" th:text="'$' + ${order.totalPrice}">$0.00</dd>
        </dl>

        <h2 class="h5 mb-3">Items</h2>
        <div class="table-responsive">
            <table class="table align-middle">
                <thead>
                    <tr>
                        <th scope="col">Product</th>
                        <th scope="col" class="text-end">Price</th>
                        <th scope="col" class="text-center">Qty</th>
                        <th scope="col" class="text-end">Line total</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="item : ${order.orderItems}">
                        <td th:text="${item.product.title}">Product title</td>
                        <td class="text-end" th:text="'$' + ${item.priceAtPurchase}">$0.00</td>
                        <td class="text-center" th:text="${item.quantity}">1</td>
                        <td class="text-end fw-semibold" th:text="'$' + ${item.lineTotal}">$0.00</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <a th:href="@{/browse}">&larr; Continue shopping</a>
    </main>
</body>
</html>
