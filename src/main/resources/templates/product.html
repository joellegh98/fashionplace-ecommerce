<!DOCTYPE html>
<!--
  Product detail page. Shows full info for a single product. The layout fragment
  supplies the header/footer; this file provides its own <title> and <main>.
-->
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::main})}">
<head>
    <title th:text="'FashionPlace - ' + ${product.title}">FashionPlace - Product</title>
</head>
<body>
    <main>
        <p class="mb-3">
            <a th:href="@{/browse}">&larr; Back to Browse</a>
        </p>

        <h1 class="mb-3" th:text="${product.title}">Product title</h1>

        <!-- Product image (shown only when an imageUrl is set) -->
        <img th:if="${product.imageUrl}" th:src="${product.imageUrl}"
             class="img-fluid rounded mb-3" alt=""
             style="max-height: 360px; object-fit: cover;">

        <dl class="row">
            <dt class="col-sm-2">Description</dt>
            <dd class="col-sm-10" th:text="${product.description}">Description</dd>

            <dt class="col-sm-2">Price</dt>
            <dd class="col-sm-10 fw-bold" th:text="'$' + ${product.price}">$0.00</dd>

            <dt class="col-sm-2">Seller</dt>
            <dd class="col-sm-10"
                th:text="${product.seller != null} ? ${product.seller.username} : 'Unknown'">Seller</dd>

            <dt class="col-sm-2">Category</dt>
            <dd class="col-sm-10" th:text="${product.category}">Category</dd>

            <dt class="col-sm-2">Condition</dt>
            <dd class="col-sm-10" th:text="${product.condition}">Condition</dd>

            <dt class="col-sm-2">Status</dt>
            <dd class="col-sm-10">
                <span class="badge"
                      th:classappend="${product.status == 'SOLD'} ? 'bg-danger' : 'bg-success'"
                      th:text="${product.status}">ACTIVE</span>
            </dd>
        </dl>

        <div th:if="${cartMessage}" class="alert alert-success mt-3" th:text="${cartMessage}">
            Added to cart.
        </div>

        <form th:if="${product.status != 'SOLD'}" th:action="@{/cart/add}" th:object="${addToCart}"
              method="post" class="mt-3">
            <input type="hidden" th:field="*{productId}">
            <div class="row g-2 align-items-end">
                <div class="col-auto">
                    <label for="quantity" class="form-label mb-0">Quantity</label>
                    <input type="number" id="quantity" class="form-control" th:field="*{quantity}"
                           min="1" style="width: 5rem;">
                </div>
                <div class="col-auto">
                    <button type="submit" class="btn btn-primary">Add to Cart</button>
                </div>
            </div>
        </form>
    </main>
</body>
</html>
