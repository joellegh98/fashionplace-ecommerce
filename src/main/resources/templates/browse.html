<!DOCTYPE html>
<!--
  Browse page. Lists all products as cards. The layout fragment supplies the
  header/footer; this file provides its own <title> and <main>.
-->
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::main})}">
<head>
    <title>FashionPlace - Browse</title>
</head>
<body>
    <main>
        <h1 class="mb-4">Browse</h1>

        <!-- Shown only when there are no products in the database -->
        <p th:if="${#lists.isEmpty(products)}" class="text-muted">
            No products available yet.
        </p>

        <!-- Responsive grid of product cards -->
        <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 g-4">
            <div class="col" th:each="product : ${products}">
                <a th:href="@{/product/{id}(id=${product.id})}"
                   class="card h-100 text-decoration-none text-dark">
                    <div class="card-body d-flex flex-column">
                        <h5 class="card-title" th:text="${product.title}">Product title</h5>
                        <p class="card-text" th:text="${product.description}">Description</p>
                        <p class="card-text fw-bold mt-auto"
                           th:text="'$' + ${product.price}">$0.00</p>
                    </div>
                </a>
            </div>
        </div>
    </main>
</body>
</html>
