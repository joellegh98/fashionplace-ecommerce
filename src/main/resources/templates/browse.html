<!DOCTYPE html>
<!--
  Browse page. Lists all products as cards. The layout fragment supplies the
  header/footer; this file provides its own <title> and <main>.
-->
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::main})}">
<head>
    <title>FashionPlace - Browse</title>
</head>
<body>
    <main>
        <h1 class="mb-4">Browse</h1>

        <div th:replace="~{fragments/productcards :: section('Recommended for you', ${recommendations})}"></div>

        <!-- One form holds the search box (top) and all filters (right sidebar);
             GET keeps every criterion in the URL -->
        <form method="get" th:action="@{/browse}" id="browseForm">

            <!-- Search box: stays at the top, full width -->
            <div class="row g-2 mb-3">
                <div class="col">
                    <div class="position-relative">
                        <input type="text" class="form-control" name="q" th:value="${q}"
                               id="searchInput" autocomplete="off"
                               placeholder="Search title or description...">
                        <ul id="titleSuggestions"
                            class="list-group position-absolute w-100 shadow-sm d-none"
                            style="z-index: 1000; top: 100%; max-height: 320px; overflow-y: auto;">
                        </ul>
                    </div>
                </div>
                <div class="col-auto">
                    <button type="submit" class="btn btn-primary">Search</button>
                </div>
            </div>

            <!-- Recent searches: stays at the top -->
            <div class="mb-3" th:if="${!#lists.isEmpty(recentSearches)}">
                <span class="small text-muted me-2">Recent searches:</span>
                <span th:each="term : ${recentSearches}" class="me-1 mb-1 d-inline-block">
                    <a th:href="@{/browse(q=${term})}"
                       class="btn btn-sm btn-outline-secondary rounded-pill"
                       th:text="${term}">term</a>
                </span>
            </div>

            <!-- Two columns: products on the left, filters on the right -->
            <div class="row">
                <div class="col-lg-9 order-2 order-lg-1">

                    <!-- Active filter badges -->
                    <div class="mb-3 d-flex flex-wrap gap-2"
                         th:if="${(q != null and !q.isEmpty()) or (category != null and !category.isEmpty()) or (condition != null and !condition.isEmpty()) or minPrice != null or maxPrice != null or (sort != null and sort != 'newest')}">
                        <span th:if="${q != null and !q.isEmpty()}" class="badge bg-primary">
                            Search: <span th:text="${q}">q</span>
                        </span>
                        <span th:if="${category != null and !category.isEmpty()}" class="badge bg-secondary">
                            Category: <span th:text="${category}">cat</span>
                        </span>
                        <span th:if="${condition != null and !condition.isEmpty()}" class="badge bg-info text-dark">
                            Condition: <span th:text="${condition}">cond</span>
                        </span>
                        <span th:if="${minPrice != null}" class="badge bg-light text-dark border">
                            Min: $<span th:text="${minPrice}">0</span>
                        </span>
                        <span th:if="${maxPrice != null}" class="badge bg-light text-dark border">
                            Max: $<span th:text="${maxPrice}">0</span>
                        </span>
                        <span th:if="${sort == 'price_asc'}" class="badge bg-light text-dark border">
                            Sort: Price low → high
                        </span>
                        <span th:if="${sort == 'price_desc'}" class="badge bg-light text-dark border">
                            Sort: Price high → low
                        </span>
                    </div>

                    <p th:if="${#lists.isEmpty(products)}" class="text-muted">
                        <span th:if="${(q != null and !q.isEmpty()) or (category != null and !category.isEmpty()) or (condition != null and !condition.isEmpty()) or minPrice != null or maxPrice != null}">
                            No products match your filters.
                        </span>
                        <span th:unless="${(q != null and !q.isEmpty()) or (category != null and !category.isEmpty()) or (condition != null and !condition.isEmpty()) or minPrice != null or maxPrice != null}">
                            No products available yet.
                        </span>
                    </p>

                    <!-- Responsive grid of product cards -->
                    <div class="row row-cols-2 row-cols-sm-3 row-cols-md-4 g-3">
                        <div class="col" th:each="product : ${products}">
                            <div class="card h-100">
                                <!-- Product image: an uploaded image (served from the DB) or an external imageUrl -->
                                <a th:href="@{/product/{id}(id=${product.id})}">
                                    <img th:if="${product.hasUploadedImage or !#strings.isEmpty(product.imageUrl)}"
                                         th:src="${product.hasUploadedImage} ? @{/api/products/{id}/image(id=${product.id})} : ${product.imageUrl}"
                                         class="card-img-top" alt="" style="height: 120px; object-fit: cover;">
                                </a>
                                <div class="card-body d-flex flex-column p-2">
                                    <h6 class="card-title mb-1">
                                        <a th:href="@{/product/{id}(id=${product.id})}"
                                           class="text-decoration-none text-dark"
                                           th:text="${product.title}">Product title</a>
                                    </h6>
                                    <!-- Category + status badges -->
                                    <div class="mb-1">
                                        <span th:if="${product.category}" class="badge bg-secondary"
                                              th:text="${product.category}">Category</span>
                                        <span th:if="${product.status == 'SOLD'}" class="badge bg-danger">Sold</span>
                                    </div>
                                    <p class="card-text small text-muted" th:text="${product.description}">Description</p>
                                    <p class="card-text fw-bold mt-auto mb-1"
                                       th:text="'$' + ${product.price}">$0.00</p>
                                    <!-- Save to wishlist (attributed to the fake current user) -->
                                    <button type="button" class="btn btn-sm w-100"
                                            th:classappend="${wishlistProductIds.contains(product.id)} ? 'btn-success' : 'btn-outline-secondary'"
                                            th:attr="data-wishlist-add=${product.id},data-label-unsaved='Save'"
                                            th:utext="${wishlistProductIds.contains(product.id)} ? '&#9829; Saved' : '&#9825; Save'">
                                        Save
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>

                </div><!-- /.col-lg-9 -->

                <!-- Filters sidebar on the right -->
                <aside class="col-lg-3 order-1 order-lg-2 mb-3 mb-lg-0">
                    <div class="card">
                        <div class="card-header py-2 fw-semibold">Filters</div>
                        <div class="card-body">
                            <div class="mb-3">
                                <label class="form-label small text-muted mb-1">Category</label>
                                <select class="form-select" name="category">
                                    <option value="">All categories</option>
                                    <option th:each="cat : ${categories}" th:value="${cat}"
                                            th:text="${cat}"
                                            th:selected="${cat == category}">Category</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label class="form-label small text-muted mb-1">Condition</label>
                                <select class="form-select" name="condition">
                                    <option value="">All conditions</option>
                                    <option th:each="cond : ${conditions}" th:value="${cond}"
                                            th:text="${cond}"
                                            th:selected="${cond == condition}">Condition</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label class="form-label small text-muted mb-1">Min price</label>
                                <input type="number" class="form-control" name="minPrice" step="0.01" min="0"
                                       th:value="${minPrice}" placeholder="0">
                            </div>
                            <div class="mb-3">
                                <label class="form-label small text-muted mb-1">Max price</label>
                                <input type="number" class="form-control" name="maxPrice" step="0.01" min="0"
                                       th:value="${maxPrice}" placeholder="Any">
                            </div>
                            <div class="mb-3">
                                <label class="form-label small text-muted mb-1">Sort by</label>
                                <select class="form-select" name="sort">
                                    <option value="newest" th:selected="${sort == 'newest'}">Newest first</option>
                                    <option value="price_asc" th:selected="${sort == 'price_asc'}">Price: low to high</option>
                                    <option value="price_desc" th:selected="${sort == 'price_desc'}">Price: high to low</option>
                                </select>
                            </div>
                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-primary">Apply</button>
                                <a class="btn btn-outline-secondary" th:href="@{/browse}"
                                   th:if="${(q != null and !q.isEmpty()) or (category != null and !category.isEmpty()) or (condition != null and !condition.isEmpty()) or minPrice != null or maxPrice != null or (sort != null and sort != 'newest')}">
                                    Clear all
                                </a>
                            </div>
                        </div>
                    </div>
                </aside>
            </div><!-- /.row -->
        </form>

        <!-- Must live inside <main>: layout only injects title + main into the page shell -->
        <script th:inline="javascript">
            (function () {
                const input = document.getElementById('searchInput');
                const list = document.getElementById('titleSuggestions');
                if (!input || !list) return;

                const suggestUrl = /*[[@{/api/products/suggest}]]*/ '/api/products/suggest';
                // Show suggestions as soon as the user types this many characters
                const MIN_CHARS = 1;

                function hide() {
                    list.classList.add('d-none');
                    list.innerHTML = '';
                }

                function render(titles) {
                    list.innerHTML = '';
                    if (titles.length === 0) {
                        hide();
                        return;
                    }
                    titles.forEach(title => {
                        const item = document.createElement('button');
                        item.type = 'button';
                        item.className = 'list-group-item list-group-item-action text-start';
                        item.textContent = title;
                        // Clicking a suggestion fills the box and runs the search
                        item.addEventListener('click', function () {
                            input.value = title;
                            hide();
                            input.form.submit();
                        });
                        list.appendChild(item);
                    });
                    list.classList.remove('d-none');
                }

                input.addEventListener('input', function () {
                    const q = input.value.trim();
                    if (q.length < MIN_CHARS) {
                        hide();
                        return;
                    }
                    fetch(suggestUrl + '?q=' + encodeURIComponent(q))
                        .then(response => response.ok ? response.json() : [])
                        .then(render)
                        .catch(hide);
                });

                // Close the dropdown when clicking elsewhere on the page
                document.addEventListener('click', function (event) {
                    if (!list.contains(event.target) && event.target !== input) {
                        hide();
                    }
                });
            })();
        </script>
    </main>
</body>
</html>
