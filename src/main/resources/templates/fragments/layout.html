<!DOCTYPE html>
<!--
  Shared page shell for every view. Pages call:
    th:replace="~{fragments/layout :: layout(~{::title}, ~{::main})}"
  passing their own <title> and <main> so the header/footer stay in one place.
-->
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:fragment="layout(title, content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- CSRF tokens for JavaScript POST requests (e.g. wishlist toggle) -->
    <meta th:if="${_csrf != null}" name="_csrf" th:content="${_csrf.token}"/>
    <meta th:if="${_csrf != null}" name="_csrf_header" th:content="${_csrf.headerName}"/>
    <!-- Site-wide favicon; served from src/main/resources/static/ -->
    <link rel="icon" type="image/jpeg" th:href="@{/favicon.jpeg}">
    <!-- Bootstrap 5 (CDN) for base styling/layout; our style.css overrides the theme colors -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <title th:replace="${title}">FashionPlace</title>
</head>
<body>
    <!-- Responsive top bar: collapses into a toggler on small screens -->
    <header>
        <nav class="navbar navbar-expand-lg">
            <div class="container-fluid">
                <!-- Logo + brand name, top-left, links back to home -->
                <a class="navbar-brand brand" th:href="@{/}">
                    <img th:src="@{/favicon.jpeg}" alt="FashionPlace logo">
                    <span>FashionPlace</span>
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                        data-bs-target="#mainNav" aria-controls="mainNav"
                        aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="mainNav">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item">
                            <a class="nav-link" th:href="@{/}">Home</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" th:href="@{/browse}">Browse</a>
                        </li>
                        <li class="nav-item" sec:authorize="isAuthenticated()">
                            <a class="nav-link" th:href="@{/sell}">Sell</a>
                        </li>
                        <li class="nav-item" sec:authorize="isAuthenticated()">
                            <a class="nav-link" th:href="@{/my-products}">My Products</a>
                        </li>
                        <li class="nav-item" sec:authorize="isAuthenticated()">
                            <a class="nav-link" th:href="@{/wishlist}">Wishlist</a>
                        </li>
                        <li class="nav-item" sec:authorize="isAuthenticated()">
                            <a class="nav-link" th:href="@{/orders}">My Orders</a>
                        </li>
                        <li class="nav-item" sec:authorize="isAuthenticated() and !hasRole('ADMIN')">
                            <a class="nav-link" th:href="@{/support}">Support</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" th:href="@{/cart}">
                                Cart
                                <span th:if="${cartCount > 0}" class="badge bg-primary rounded-pill ms-1"
                                      th:text="${cartCount}">0</span>
                            </a>
                        </li>
                        <li class="nav-item" th:if="${isAdmin}">
                            <a class="nav-link" th:href="@{/admin}">Admin</a>
                        </li>
                        <li class="nav-item" sec:authorize="!isAuthenticated()">
                            <a class="nav-link" th:href="@{/login}">Log in</a>
                        </li>
                        <li class="nav-item" sec:authorize="!isAuthenticated()">
                            <a class="nav-link" th:href="@{/register}">Register</a>
                        </li>
                        <li class="nav-item" sec:authorize="isAuthenticated()">
                            <form th:action="@{/logout}" method="post" class="d-inline">
                                <button type="submit" class="btn btn-link nav-link px-2">Log out</button>
                            </form>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <!-- Responsive container; the calling page's <main> block is injected inside -->
    <div class="container py-4 flex-grow-1">
        <!-- Flash banners after redirects (successMessage / errorMessage from RedirectAttributes) -->
        <div th:if="${successMessage != null}" class="alert alert-success alert-dismissible fade show" role="alert">
            <span th:text="${successMessage}">Success</span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        <div th:if="${errorMessage != null}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <span th:text="${errorMessage}">Error</span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        <main th:replace="${content}">Page content goes here.</main>
    </div>

    <footer>
        <small>&copy; FashionPlace</small>
    </footer>

    <!-- Reusable confirmation modal. Any form with data-confirm="message" submits through it. -->
    <div class="modal fade" id="confirmModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Please confirm</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body" id="confirmModalMessage">Are you sure?</div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-danger" id="confirmModalConfirm">Confirm</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS bundle (enables dropdowns, navbar toggler, etc.) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Adds-to-wishlist without reloading the page -->
    <script th:src="@{/js/wishlist.js}"></script>
    <!-- Replaces native confirm() with the Bootstrap modal above -->
    <script th:src="@{/js/confirm.js}"></script>
</body>
</html>
