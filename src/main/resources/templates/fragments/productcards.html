<!DOCTYPE html>
<!--
  Reusable product-card section. Renders a heading + a grid of compact product cards.
  Hidden entirely when the product list is empty. Usage:
    th:replace="~{fragments/productcards :: section('Recommended for you', ${recommendations})}"
-->
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
    <section th:fragment="section(title, products)"
             th:if="${products != null and !#lists.isEmpty(products)}" class="mb-4">
        <h2 class="h4 mb-3" th:text="${title}">Products</h2>
        <div class="row row-cols-2 row-cols-md-5 g-2">
            <div class="col" th:each="product : ${products}">
                <a th:href="@{/product/{id}(id=${product.id})}"
                   class="card h-100 text-decoration-none text-dark">
                    <img th:if="${product.hasUploadedImage or !#strings.isEmpty(product.imageUrl)}"
                         th:src="${product.hasUploadedImage} ? @{/product/{id}/image(id=${product.id})} : ${product.imageUrl}"
                         class="card-img-top" alt="" style="height: 100px; object-fit: cover;">
                    <div class="card-body p-2">
                        <h6 class="card-title mb-1 small" th:text="${product.title}">Product title</h6>
                        <span class="fw-bold small" th:text="'$' + ${product.price}">$0.00</span>
                    </div>
                </a>
            </div>
        </div>
    </section>
</body>
</html>
