<!DOCTYPE html>
<!--
  Star rating display. Usage:
    th:replace="~{fragments/stars :: display(${averageRating})}"
  Supports whole and half stars (e.g. 4.5 → four full + one half).
-->
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
    <span th:fragment="display(rating)"
          class="star-rating"
          th:attr="aria-label=|${rating} out of 5 stars|"
          role="img">
        <th:block th:each="s : ${#numbers.sequence(1, 5)}">
            <span class="star star-full" th:if="${rating >= s}" aria-hidden="true">&#9733;</span>
            <span class="star star-half" th:if="${rating < s and rating >= s - 0.5}" aria-hidden="true">
                <span class="star-half-empty">&#9734;</span>
                <span class="star-half-full">&#9733;</span>
            </span>
            <span class="star star-empty" th:if="${rating < s - 0.5}" aria-hidden="true">&#9734;</span>
        </th:block>
    </span>
</body>
</html>
