<!DOCTYPE html>
<!--
  Registration page. Creates a new USER account via RegistrationController.
-->
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::main})}">
<head>
    <title>FashionPlace - Register</title>
</head>
<body>
    <main>
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <h1 class="mb-4">Create an account</h1>

                <form th:action="@{/register}" th:object="${registrationForm}" method="post">
                    <div class="mb-3">
                        <label for="username" class="form-label">Username</label>
                        <input type="text" id="username" class="form-control" th:field="*{username}"
                               autocomplete="username" th:errorclass="is-invalid">
                        <div class="text-danger small"
                             th:if="${#fields.hasErrors('username')}"
                             th:errors="*{username}"></div>
                    </div>

                    <div class="mb-3">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" id="email" class="form-control" th:field="*{email}"
                               autocomplete="email" th:errorclass="is-invalid">
                        <div class="text-danger small"
                             th:if="${#fields.hasErrors('email')}"
                             th:errors="*{email}"></div>
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" id="password" class="form-control" th:field="*{password}"
                               autocomplete="new-password" th:errorclass="is-invalid">
                        <div class="form-text">At least 8 characters, with one letter and one number.</div>
                        <div class="text-danger small"
                             th:if="${#fields.hasErrors('password')}"
                             th:errors="*{password}"></div>
                    </div>

                    <div class="mb-3">
                        <label for="confirmPassword" class="form-label">Confirm password</label>
                        <input type="password" id="confirmPassword" class="form-control"
                               th:field="*{confirmPassword}" autocomplete="new-password"
                               th:errorclass="is-invalid">
                        <div class="text-danger small"
                             th:if="${#fields.hasErrors('confirmPassword')}"
                             th:errors="*{confirmPassword}"></div>
                    </div>

                    <div class="mb-3">
                        <label for="address" class="form-label">Address <span class="text-muted">(optional)</span></label>
                        <input type="text" id="address" class="form-control" th:field="*{address}"
                               autocomplete="street-address">
                    </div>

                    <button type="submit" class="btn btn-primary w-100">Register</button>
                </form>

                <p class="mt-3 mb-0">
                    Already have an account?
                    <a th:href="@{/login}">Log in</a>
                </p>
            </div>
        </div>
    </main>
</body>
</html>
