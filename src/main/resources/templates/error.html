<!DOCTYPE html>
<!--
  Single catch-all error page. Spring Boot resolves templates/error.html for any error
  status (404, 403, 500, ...) when no more specific error view exists. Uses the shared layout.
-->
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::main})}">
<head>
    <title>FashionPlace - Error</title>
</head>
<body>
    <main>
        <div class="text-center py-5">
            <h1 class="h3 mb-3">An error has occurred</h1>
            <p class="text-muted">Sorry, something went wrong. Please try again.</p>
            <a th:href="@{/}" class="btn btn-primary mt-2">Go to Home</a>
        </div>
    </main>
</body>
</html>
