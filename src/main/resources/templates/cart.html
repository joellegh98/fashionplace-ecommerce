<!DOCTYPE html>
<!--
  Shopping cart page. Lists session cart lines with quantities, line totals, and grand total.
-->
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::main})}">
<head>
    <title>FashionPlace - Cart</title>
</head>
<body>
    <main>
        <h1 class="mb-4">Your Cart</h1>

        <div th:if="${#lists.isEmpty(cartItems)}" class="alert alert-info">
            Your cart is empty.
            <a th:href="@{/browse}">Browse products</a>
        </div>

        <div th:unless="${#lists.isEmpty(cartItems)}">
            <div class="table-responsive">
                <table class="table align-middle">
                    <thead>
                        <tr>
                            <th scope="col">Product</th>
                            <th scope="col" class="text-end">Price</th>
                            <th scope="col" class="text-center">Qty</th>
                            <th scope="col" class="text-end">Line total</th>
                            <th scope="col" class="text-end">Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="item : ${cartItems}">
                            <td>
                                <a th:href="@{/product/{id}(id=${item.id})}" th:text="${item.title}">
                                    Product title
                                </a>
                            </td>
                            <td class="text-end" th:text="'$' + ${item.price}">$0.00</td>
                            <td>
                                <form th:action="@{/cart/update}" method="post"
                                      class="d-flex gap-1 justify-content-center align-items-center">
                                    <input type="hidden" name="productId" th:value="${item.id}">
                                    <input type="number" name="quantity" th:value="${item.quantity}" min="1"
                                           class="form-control form-control-sm" style="width: 4.5rem;">
                                    <button type="submit" class="btn btn-sm btn-outline-primary">Update</button>
                                </form>
                            </td>
                            <td class="text-end fw-semibold" th:text="'$' + ${item.lineTotal}">$0.00</td>
                            <td class="text-end">
                                <form th:action="@{/cart/remove/{id}(id=${item.id})}" method="post"
                                      class="d-inline">
                                    <button type="submit" class="btn btn-sm btn-outline-danger">Remove</button>
                                </form>
                            </td>
                        </tr>
                    </tbody>
                    <tfoot>
                        <tr>
                            <th colspan="3" class="text-end">Grand total</th>
                            <th class="text-end" th:text="'$' + ${grandTotal}">$0.00</th>
                            <td></td>
                        </tr>
                    </tfoot>
                </table>
            </div>

            <p class="mb-0">
                <a th:href="@{/browse}">&larr; Continue shopping</a>
            </p>
        </div>
    </main>
</body>
</html>
