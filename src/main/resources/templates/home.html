<!DOCTYPE html>
<!--
  Home page. The layout fragment supplies the header/footer; this file only
  provides its own <title> and <main>, which the fragment slots into place.
-->
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::main})}">
<head>
    <title>FashionPlace - Home</title>
</head>
<body>
    <main>
        <h1 class="mb-4">FashionPlace</h1>

        <div th:replace="~{fragments/productcards :: section('Recommended for you', ${recommendations})}"></div>
    </main>
</body>
</html>
