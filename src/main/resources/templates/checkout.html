<!DOCTYPE html>
<!--
  Checkout page. Shows a read-only cart summary and a shipping address field.
  Placing the order (POST /checkout) is wired up in Phase 5.3.
-->
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::main})}">
<head>
    <title>FashionPlace - Checkout</title>
</head>
<body>
    <main>
        <h1 class="mb-4">Checkout</h1>

        <div class="row">
            <!-- Order summary -->
            <div class="col-lg-7 mb-4">
                <h2 class="h5 mb-3">Order summary</h2>
                <div class="table-responsive">
                    <table class="table align-middle">
                        <thead>
                            <tr>
                                <th scope="col">Product</th>
                                <th scope="col" class="text-end">Price</th>
                                <th scope="col" class="text-center">Qty</th>
                                <th scope="col" class="text-end">Line total</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="item : ${cartItems}">
                                <td th:text="${item.title}">Product title</td>
                                <td class="text-end" th:text="'$' + ${item.price}">$0.00</td>
                                <td class="text-center" th:text="${item.quantity}">1</td>
                                <td class="text-end fw-semibold" th:text="'$' + ${item.lineTotal}">$0.00</td>
                            </tr>
                        </tbody>
                        <tfoot>
                            <tr>
                                <th colspan="3" class="text-end">Grand total</th>
                                <th class="text-end" th:text="'$' + ${grandTotal}">$0.00</th>
                            </tr>
                        </tfoot>
                    </table>
                </div>
                <a th:href="@{/cart}">&larr; Back to cart</a>
            </div>

            <!-- Shipping form -->
            <div class="col-lg-5">
                <h2 class="h5 mb-3">Shipping</h2>
                <form th:action="@{/checkout}" th:object="${checkoutForm}" method="post">
                    <div class="mb-3">
                        <label for="shippingAddress" class="form-label">Shipping address</label>
                        <textarea id="shippingAddress" class="form-control" rows="3"
                                  th:field="*{shippingAddress}"></textarea>
                        <div class="text-danger small"
                             th:if="${#fields.hasErrors('shippingAddress')}"
                             th:errors="*{shippingAddress}"></div>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Place order</button>
                </form>
            </div>
        </div>
    </main>
</body>
</html>
